<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker & Ticker HUD</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --hover: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --accent: #38bdf8;
      --border: #1e293b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-icon {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .pinned-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .pinned-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .pinned-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .pinned-price {
      font-size: 22px;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: -0.5px;
    }
    .badge-pill {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: monospace;
    }
    .badge-pill.up { background: var(--green-bg); color: var(--green); }
    .badge-pill.down { background: var(--red-bg); color: var(--red); }
    .pinned-stats {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .chart-range { display: flex; gap: 3px; }
    .chart-range button { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer; }
    .chart-range button.active { background: var(--accent); color: #082f49; border-color: var(--accent); font-weight: 700; }
    #sparkline { width: 100%; height: 58px; display: block; margin-top: 4px; overflow: visible; }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: rgba(56, 189, 248, 0.12); }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .watchlist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .toolbar { display: flex; gap: 6px; margin-bottom: 10px; }
    .toolbar input:not([type="file"]), .toolbar select, .alert-form input, .alert-form select {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 7px; font-size: 11px; min-width: 0;
    }
    .toolbar input { flex: 1; }
    .btn { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 9px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .btn:hover { background: var(--hover); border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #082f49; font-weight: 700; }
    .btn-primary:hover { opacity: 0.9; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; width: 320px; max-width: 90vw; }
    .modal h3 { font-size: 14px; margin-bottom: 12px; }
    .modal input { width: 100%; padding: 8px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .watch-row[draggable="true"] { cursor: grab; }
    .watch-row[draggable="true"]:active { cursor: grabbing; }
    .watch-row.drag-over { border-color: var(--accent); background: var(--hover); }
    .import-export { display: flex; gap: 6px; }
    #importFile { display: none; }
    .alert-panel { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 9px; margin-bottom: 12px; }
    .alert-form { display: flex; gap: 5px; }
    .alert-form input { width: 82px; }
    .alert-form button { background: var(--accent); color: #082f49; border: 0; border-radius: 4px; padding: 5px 8px; font-weight: 700; cursor: pointer; }
    .alert-list { margin-top: 7px; color: var(--text-muted); font-size: 10px; }
    .alert-item { display: flex; justify-content: space-between; padding-top: 4px; }
    .remove-alert { color: var(--red); cursor: pointer; border: 0; background: none; }
    .empty { color: var(--text-muted); padding: 12px; text-align: center; }
    .watch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      transition: background 0.15s;
    }
    .watch-row:hover {
      background: var(--hover);
    }
    .watch-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pin-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      opacity: 0.3;
      transition: opacity 0.15s;
    }
    .pin-btn.active {
      opacity: 1;
      color: #fbbf24;
    }
    .watch-name {
      font-weight: 700;
      font-size: 12.5px;
    }
    .watch-sub {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .watch-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .watch-price {
      font-family: monospace;
      font-weight: 700;
      font-size: 13px;
      text-align: right;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="live-dot"></div>
      <span>Finance Tracker HUD</span>
    </div>
    <div class="controls">
      <button class="btn-icon" id="refreshBtn" title="Refresh Live Prices">🔄</button>
      <button class="btn-icon" id="addAssetBtn" title="Add Custom Asset">➕</button>
      <button class="btn-icon" id="exportBtn" title="Export Watchlist">📤</button>
      <button class="btn-icon" id="importBtn" title="Import Watchlist">📥</button>
    </div>
  </div>

  <div class="pinned-card" id="pinnedCard">
    <div class="pinned-header">
      <span id="pinnedSymbol">XAU/USD (Gold Spot)</span>
      <span>⭐ Pinned to Badge</span>
    </div>
    <div class="pinned-price-row">
      <span class="pinned-price" id="pinnedPrice">$2,912.40</span>
      <span class="badge-pill up" id="pinnedChange">+0.85%</span>
    </div>
    <div class="pinned-stats">
      <span>24h High: <strong id="pinnedHigh">$2,925.00</strong></span>
      <span>24h Low: <strong id="pinnedLow">$2,890.10</strong></span>
    </div>
    <div class="signals-row" style="display:flex;gap:10px;margin-top:8px;font-size:10px;color:var(--text-muted);">
      <span>MA20: <strong id="ma20" style="color:var(--text);">—</strong></span>
      <span>MA50: <strong id="ma50" style="color:var(--text);">—</strong></span>
      <span>RSI: <strong id="rsi" style="color:var(--text);">—</strong></span>
    </div>
    <div class="chart-header"><span class="watch-sub">Price history</span><div class="chart-range"><button data-range="1d" class="active">1D</button><button data-range="7d">7D</button><button data-range="1m">1M</button><button data-range="3m">3M</button><button data-range="1y">1Y</button></div></div>
    <svg id="sparkline" viewBox="0 0 360 58" role="img" aria-label="Price history chart"></svg>
  </div>

  <div class="modal-overlay" id="addAssetModal">
    <div class="modal">
      <h3>Add Custom Asset</h3>
      <input type="text" id="customSymbol" placeholder="Symbol (e.g., DOGE, ADA, TSLA)" autocomplete="off">
      <input type="text" id="customName" placeholder="Display name (optional)" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" id="cancelAddAsset">Cancel</button>
        <button class="btn btn-primary" id="confirmAddAsset">Add Asset</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFile" accept=".json">

  <div class="section-title">Watchlist</div>
  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Search assets...">
    <select id="typeFilter" title="Filter asset type">
      <option value="all">All types</option><option value="commodity">Commodities</option>
      <option value="crypto">Crypto</option><option value="index">Indices</option><option value="forex">Forex</option>
    </select>
  </div>
  <div class="watchlist" id="watchlistContainer">
    <!-- Dynamic rows populated by popup.js -->
  </div>

  <div class="alert-panel">
    <div class="section-title">Price alerts</div>
    <form class="alert-form" id="alertForm">
      <select id="alertAsset" aria-label="Alert asset"></select>
      <select id="alertCondition" aria-label="Alert condition"><option value="above">Above</option><option value="below">Below</option></select>
      <input id="alertTarget" type="number" min="0" step="any" placeholder="Target">
      <button type="submit">Add</button>
    </form>
    <div class="alert-list" id="alertList">No active alerts.</div>
  </div>

  <div class="footer">
    <label style="cursor: pointer;">
      Badge: 
      <select id="badgeModeSelect" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; font-size: 10.5px;">
        <option value="price">Price ($)</option>
        <option value="change">% Change</option>
      </select>
    </label>
    <label style="cursor: pointer;">
      Theme: <select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select>
    </label>
    <label>Poll: <select id="intervalSelect"><option value="1">1m</option><option value="5">5m</option><option value="15">15m</option></select></label>
    <span id="lastUpdated">Updated: Just now</span>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
